name: Deploy to GCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: eirene-production
  GKE_ZONE: us-central1-a
  REGISTRY: gcr.io

jobs:
  setup-build-deploy:
    name: Setup, Build, and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $GKE_CLUSTER \
          --zone $GKE_ZONE \
          --project $PROJECT_ID

    - name: Build Docker Images
      run: |
        # API Gateway
        docker build -t $REGISTRY/$PROJECT_ID/eirene-api-gateway:$GITHUB_SHA \
          -f Dockerfile.gateway .
        
        # AI Engine
        docker build -t $REGISTRY/$PROJECT_ID/eirene-ai-engine:$GITHUB_SHA \
          -f Dockerfile.ai-engine .
        
        # Mood Service
        docker build -t $REGISTRY/$PROJECT_ID/eirene-mood-service:$GITHUB_SHA \
          -f Dockerfile.mood .
        
        # Add other services...

    - name: Push Docker Images
      run: |
        docker push $REGISTRY/$PROJECT_ID/eirene-api-gateway:$GITHUB_SHA
        docker push $REGISTRY/$PROJECT_ID/eirene-ai-engine:$GITHUB_SHA
        docker push $REGISTRY/$PROJECT_ID/eirene-mood-service:$GITHUB_SHA

    - name: Run Tests
      run: |
        pip install -r requirements.txt
        pytest tests/ --cov=./ --cov-report=xml

    - name: Deploy to GKE
      run: |
        # Update image tags
        kubectl set image deployment/api-gateway \
          api-gateway=$REGISTRY/$PROJECT_ID/eirene-api-gateway:$GITHUB_SHA \
          -n eirene-prod
        
        kubectl set image deployment/ai-engine \
          ai-engine=$REGISTRY/$PROJECT_ID/eirene-ai-engine:$GITHUB_SHA \
          -n eirene-prod
        
        # Wait for rollout
        kubectl rollout status deployment/api-gateway -n eirene-prod
        kubectl rollout status deployment/ai-engine -n eirene-prod

    - name: Verify Deployment
      run: |
        kubectl get services -n eirene-prod
        kubectl get pods -n eirene-prod

    - name: Notify Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Deployment to production: ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
