apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: eirene-prod
  labels:
    app: ai-engine
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: gcr.io/YOUR_PROJECT_ID/eirene-ai-engine:latest
        ports:
        - containerPort: 5006
          name: http
        envFrom:
        - configMapRef:
            name: eirene-config
        - secretRef:
            name: eirene-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: eirene-prod
spec:
  type: ClusterIP
  ports:
  - port: 5006
    targetPort: 5006
    protocol: TCP
  selector:
    app: ai-engine
